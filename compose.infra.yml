services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleet_rentals
      POSTGRES_USER: fleet_rentals
      POSTGRES_PASSWORD: fleet_rentals
    ports:
      - "127.0.0.1:${FLEET_PG_PORT:-21016}:5432"
    volumes:
      - fleet-rentals-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_rentals -d fleet_rentals"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  fleet-rentals-postgres:
